services:
  - type: web
    name: capaz-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: EXPOSE_DEV_LOGIN_CODE
        value: "true"
      - key: OCR_PROVIDER
        value: ia
      - key: IA_TIMEOUT_MS
        value: "60000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ID_CARD_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: IA_SERVICE_URL
        sync: false
      - key: IA_SERVICE_TOKEN
        sync: false
